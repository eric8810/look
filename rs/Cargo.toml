[package]
name = "look"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "look"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
termimad = "0.35"
minimad = "0.16"
mermansi = "0.1.6"
ansi-to-tui = "8.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
